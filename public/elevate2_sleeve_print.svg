<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
      
      .bg-layer {
        fill: #1A3B2B;
      }
      
      .sleeve-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 18px;
        fill: #EAE6DF;
        letter-spacing: 12px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background layer (can be hidden or deleted in Illustrator/Photoshop) -->
  <rect width="100%" height="100%" class="bg-layer" id="background-toggle-layer" />

  <!-- Centered NEVER SETTLE text for sleeve print -->
  <text x="231" y="58" class="sleeve-text">NEVER SETTLE</text>
</svg>
