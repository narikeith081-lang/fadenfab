<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap');
      
      .bg-layer {
        fill: #1A3B2B;
      }
      
      .brand-text-front {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 28px;
        fill: #EAE6DF;
        letter-spacing: 14px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background layer (can be hidden or deleted in Illustrator/Photoshop) -->
  <rect width="100%" height="100%" class="bg-layer" id="background-toggle-layer" />

  <!-- Centered FADENFAB logo for front print -->
  <text x="207" y="85" class="brand-text-front">FADENFAB</text>
</svg>
