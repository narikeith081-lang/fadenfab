<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&amp;display=swap');
      
      .bg-layer {
        fill: #1A3B2B;
      }
      
      .title-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        fill: #EAE6DF;
        letter-spacing: 12px;
        text-anchor: middle;
      }
      
      .subtitle-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 16px;
        fill: #EAE6DF;
        letter-spacing: 6px;
        text-anchor: middle;
      }
      
      .details-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 10px;
        fill: #EAE6DF;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      
      .brand-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #EAE6DF;
        letter-spacing: 9px;
        text-anchor: middle;
      }
      
      .coordinate-text {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 8px;
        fill: #EAE6DF;
        letter-spacing: 2px;
      }
      
      .line-artwork {
        stroke: #EAE6DF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      
      .thin-artwork {
        stroke: #EAE6DF;
        stroke-width: 0.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      
      .dashed-artwork {
        stroke: #EAE6DF;
        stroke-width: 0.8;
        stroke-dasharray: 4, 4;
        fill: none;
      }

      .mountain-base {
        fill: #1A3B2B;
        stroke: #EAE6DF;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .cloud-base {
        fill: #1A3B2B;
        stroke: #EAE6DF;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>

    <!-- Hatching patterns for high quality vector mountain shading -->
    <pattern id="hatch-right" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#EAE6DF" stroke-width="0.8" stroke-opacity="0.8" />
    </pattern>
    
    <pattern id="hatch-left" width="8" height="8" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#EAE6DF" stroke-width="0.6" stroke-opacity="0.5" />
    </pattern>

    <!-- Clip path to keep mountain inside the frame -->
    <clipPath id="frame-clip">
      <rect x="150" y="180" width="300" height="380" />
    </clipPath>
  </defs>

  <!-- Background layer (can be hidden or deleted in Illustrator/Photoshop) -->
  <rect width="100%" height="100%" class="bg-layer" id="background-toggle-layer" />

  <g id="elevate-design-back">
    
    <!-- ELEVATE Title -->
    <text x="306" y="125" class="title-text">ELEVATE</text>
    
    <!-- Outer Decorative Geometric Frame (Behind Box) -->
    <!-- Diamond -->
    <path d="M 300 130 L 485 370 L 300 610 L 115 370 Z" class="thin-artwork" />
    
    <!-- Horizontal ticks and coordinates -->
    <line x1="85" y1="370" x2="515" y2="370" class="thin-artwork" />
    <line x1="300" y1="100" x2="300" y2="640" class="thin-artwork" />
    
    <!-- Dial ticks along coordinate axes -->
    <path d="M 120 365 L 120 375 M 130 367 L 130 373 M 140 367 L 140 373 
             M 460 367 L 460 373 M 470 367 L 470 373 M 480 365 L 480 375" class="thin-artwork" />
    <path d="M 295 140 L 305 140 M 297 150 L 303 150 M 297 160 L 303 160
             M 297 580 L 303 580 M 297 590 L 303 590 M 295 600 L 305 600" class="thin-artwork" />
             
    <!-- Accent brackets/arrows at outer limits -->
    <path d="M 80 365 L 75 370 L 80 375" class="thin-artwork" fill="none" />
    <path d="M 520 365 L 525 370 L 520 375" class="thin-artwork" fill="none" />
    <path d="M 295 95 L 300 90 L 305 95" class="thin-artwork" fill="none" />
    <path d="M 295 645 L 300 650 L 305 645" class="thin-artwork" fill="none" />

    <!-- GPS Coordinates -->
    <text x="150" y="172" class="coordinate-text" text-anchor="start">45° 49' 57" N</text>
    <text x="450" y="575" class="coordinate-text" text-anchor="end">6° 51' 52" E</text>

    <!-- Side Vertical Decorator Lines -->
    <line x1="120" y1="200" x2="120" y2="540" class="thin-artwork" />
    <circle cx="120" cy="200" r="2.5" fill="#EAE6DF" />
    <path d="M 117 540 L 120 545 L 123 540 Z" fill="#EAE6DF" />
    
    <line x1="480" y1="200" x2="480" y2="540" class="thin-artwork" />
    <circle cx="480" cy="200" r="2.5" fill="#EAE6DF" />
    <path d="M 477 540 L 480 545 L 483 540 Z" fill="#EAE6DF" />

    <!-- Inner Double Frame Box (Clipping Mountain Artwork) -->
    <rect x="150" y="180" width="300" height="380" class="line-artwork" />
    <rect x="144" y="174" width="312" height="392" class="thin-artwork" />
    
    <!-- Mountain and Clouds Artwork (Clipped) -->
    <g clip-path="url(#frame-clip)" id="mountain-artwork">
      
      <!-- BACKGROUND / DISTANT PEAKS -->
      <!-- Far Left Peak -->
      <polygon points="120,560 180,350 250,560" class="mountain-base" />
      <polygon points="180,350 250,560 180,560" fill="url(#hatch-right)" />
      
      <!-- Far Right Peak -->
      <polygon points="320,560 410,320 480,560" class="mountain-base" />
      <polygon points="410,320 480,560 410,560" fill="url(#hatch-right)" />
      <polygon points="320,560 410,320 320,560" fill="url(#hatch-left)" />

      <!-- MIDDLE PEAKS -->
      <!-- Mid-Left Mountain -->
      <polygon points="140,560 230,290 320,560" class="mountain-base" />
      <!-- Mid-Left Ridge & Hatching -->
      <path d="M 230 290 Q 235 370 220 460 Q 235 510 225 560" class="line-artwork" />
      <!-- Left side of ridge (lighter shade hatch) -->
      <path d="M 230 290 Q 235 370 220 460 Q 235 510 225 560 L 140 560 Z" fill="url(#hatch-left)" />
      <!-- Right side of ridge (darker shade hatch) -->
      <path d="M 230 290 Q 235 370 220 460 Q 235 510 225 560 L 320 560 Z" fill="url(#hatch-right)" />

      <!-- Mid-Right Mountain -->
      <polygon points="270,560 370,270 460,560" class="mountain-base" />
      <!-- Mid-Right Ridge & Hatching -->
      <path d="M 370 270 Q 365 350 375 450 Q 365 510 370 560" class="line-artwork" />
      <!-- Left side of ridge -->
      <path d="M 370 270 Q 365 350 375 450 Q 365 510 370 560 L 270 560 Z" fill="url(#hatch-left)" />
      <!-- Right side of ridge -->
      <path d="M 370 270 Q 365 350 375 450 Q 365 510 370 560 L 460 560 Z" fill="url(#hatch-right)" />

      <!-- MAIN CENTER PEAK -->
      <!-- Base Shape -->
      <polygon points="160,560 300,210 440,560" class="mountain-base" />
      
      <!-- Main Ridge (zig-zag organic line) -->
      <path d="M 300 210 
               L 295 250 
               L 305 300 
               L 290 350 
               L 310 410 
               L 298 480 
               L 305 560" class="line-artwork" />
               
      <!-- Left Slope Shading (Fine detail lines) -->
      <path d="M 300 210 L 295 250 L 305 300 L 290 350 L 310 410 L 298 480 L 305 560 L 160 560 Z" fill="url(#hatch-left)" />
      
      <!-- Right Slope Shading (Heavy hatching) -->
      <path d="M 300 210 L 295 250 L 305 300 L 290 350 L 310 410 L 298 480 L 305 560 L 440 560 Z" fill="url(#hatch-right)" />

      <!-- Additional detail ridge lines on slopes -->
      <path d="M 300 210 Q 320 280 350 340" class="thin-artwork" />
      <path d="M 295 250 Q 280 300 250 360" class="thin-artwork" />
      <path d="M 305 300 Q 330 380 380 440" class="thin-artwork" />
      <path d="M 290 350 Q 260 410 210 480" class="thin-artwork" />
      <path d="M 310 410 Q 340 470 410 520" class="thin-artwork" />

      <!-- FOREGROUND / BASE PEAKS -->
      <!-- Foreground Small Left Peak -->
      <polygon points="130,560 190,440 260,560" class="mountain-base" />
      <polygon points="190,440 260,560 190,560" fill="url(#hatch-right)" />
      <path d="M 190 440 Q 195 490 192 560" class="line-artwork" />

      <!-- Foreground Small Right Peak -->
      <polygon points="340,560 410,420 480,560" class="mountain-base" />
      <polygon points="410,420 480,560 410,560" fill="url(#hatch-right)" />
      <path d="M 410 420 Q 405 480 412 560" class="line-artwork" />
      
      <!-- CLOUD SYSTEM 1 (MID-HEIGHT CLOUDS WRAPPING MAIN PEAK) -->
      <!-- Left cloud float -->
      <path d="M 140 370 
               C 150 355, 175 355, 185 370 
               C 195 350, 225 350, 235 370 
               C 245 360, 265 365, 270 380 
               L 270 405 
               C 255 410, 240 405, 230 395
               C 220 405, 195 405, 185 395
               C 175 405, 150 405, 140 390
               Z" class="cloud-base" />
      <!-- Cloud detail lines -->
      <path d="M 155 375 Q 170 365 180 378" class="thin-artwork" />
      <path d="M 195 375 Q 210 365 225 378" class="thin-artwork" />
      <path d="M 150 390 Q 185 398 215 390" class="thin-artwork" />

      <!-- Right cloud float -->
      <path d="M 330 350 
               C 345 330, 375 330, 390 350 
               C 405 335, 435 335, 450 350 
               C 460 345, 475 355, 475 370 
               L 475 395
               C 465 400, 450 395, 440 385
               C 430 395, 405 395, 395 385
               C 385 395, 355 395, 345 380
               C 335 375, 325 365, 330 350" class="cloud-base" />
      <!-- Cloud detail lines -->
      <path d="M 345 355 Q 365 345 380 358" class="thin-artwork" />
      <path d="M 405 355 Q 425 345 440 358" class="thin-artwork" />
      <path d="M 355 378 Q 395 385 435 378" class="thin-artwork" />

      <!-- LARGE BASE CLOUDS (OVERLAY AT BOTTOM OF THE MOUNTAIN FRAME) -->
      <!-- Giant billowing cloud bank at base -->
      <path d="M 120 500 
               C 135 470, 175 460, 195 490
               C 210 465, 255 455, 275 485
               C 290 460, 335 450, 355 480
               C 375 455, 420 465, 435 490
               C 455 470, 485 485, 480 515
               L 480 570 L 120 570 Z" class="cloud-base" />
      
      <!-- Base Cloud inner curves for stylized woodcut/engraving effect -->
      <path d="M 135 500 C 150 485, 175 485, 190 500" class="thin-artwork" />
      <path d="M 170 510 C 185 495, 210 495, 225 510" class="thin-artwork" />
      
      <path d="M 210 490 C 225 475, 255 475, 270 490" class="thin-artwork" />
      <path d="M 250 505 C 265 490, 295 490, 310 505" class="thin-artwork" />
      
      <path d="M 290 480 C 305 465, 335 465, 350 480" class="thin-artwork" />
      <path d="M 330 500 C 345 485, 375 485, 390 500" class="thin-artwork" />
      
      <path d="M 375 490 C 390 475, 420 475, 435 490" class="thin-artwork" />
      <path d="M 415 510 C 430 495, 455 495, 470 510" class="thin-artwork" />
      
      <!-- Fine horizontal ripples at very bottom -->
      <line x1="140" y1="535" x2="460" y2="535" class="thin-artwork" />
      <line x1="160" y1="542" x2="440" y2="542" class="thin-artwork" />
      <line x1="190" y1="549" x2="410" y2="549" class="thin-artwork" />
      <line x1="230" y1="556" x2="370" y2="556" class="thin-artwork" />
      
    </g>

    <!-- Bottom Typography Block -->
    <g id="bottom-typography">
      <!-- HIGHER EVERY DAY -->
      <text x="303" y="620" class="subtitle-text">HIGHER EVERY DAY</text>
      
      <!-- Decorative separator line -->
      <line x1="200" y1="635" x2="400" y2="635" class="thin-artwork" />
      <polygon points="300,632 303,635 300,638 297,635" fill="#EAE6DF" stroke="none" />
      <circle cx="200" cy="635" r="1.5" fill="#EAE6DF" />
      <circle cx="400" cy="635" r="1.5" fill="#EAE6DF" />
      
      <!-- DISCIPLINE • CONSISTENCY • GROWTH -->
      <text x="302" y="658" class="details-text">DISCIPLINE • CONSISTENCY • GROWTH</text>
      
      <!-- FADENFAB -->
      <text x="304" y="692" class="brand-text">FADENFAB</text>
    </g>
    
  </g>
</svg>
